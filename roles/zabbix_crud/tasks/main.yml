    http_strip_domains: "{{ item.http_strip_domains | default(omit) }}"
    jit_provision_interval: "{{ item.jit_provision_interval | default(omit) }}"
    ldap_auth_enabled: "{{ item.ldap_auth_enabled | default(omit) }}"
    ldap_case_sensitive: "{{ item.ldap_case_sensitive | default(omit) }}"
    ldap_userdirectory: "{{ item.ldap_userdirectory | default(omit) }}"
    passwd_check_rules: "{{ item.passwd_check_rules | default(omit) }}"
    passwd_min_length: "{{ item.passwd_min_length | default(omit) }}"
    saml_auth_enabled: "{{ item.saml_auth_enabled | default(omit) }}"
    saml_case_sensitive: "{{ item.saml_case_sensitive | default(omit) }}"
    saml_encrypt_assertions: "{{ item.saml_encrypt_assertions | default(omit) }}"
    saml_encrypt_nameid: "{{ item.saml_encrypt_nameid | default(omit) }}"
    saml_idp_entityid: "{{ item.saml_idp_entityid | default(omit) }}"
    saml_jit_status: "{{ item.saml_jit_status | default(omit) }}"
    saml_nameid_format: "{{ item.saml_nameid_format | default(omit) }}"
    saml_sign_assertions: "{{ item.saml_sign_assertions | default(omit) }}"
    saml_sign_authn_requests: "{{ item.saml_sign_authn_requests | default(omit) }}"
    saml_sign_logout_requests: "{{ item.saml_sign_logout_requests | default(omit) }}"
    saml_sign_logout_responses: "{{ item.saml_sign_logout_responses | default(omit) }}"
    saml_sign_messages: "{{ item.saml_sign_messages | default(omit) }}"
    saml_slo_url: "{{ item.saml_slo_url | default(omit) }}"
