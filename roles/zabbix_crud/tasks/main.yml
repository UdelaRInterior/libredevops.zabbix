    group_basedn: "{{ item.group_basedn | default(omit) }}"
    group_filter: "{{ item.group_filter | default(omit) }}"
    group_member: "{{ item.group_member | default(omit) }}"
    group_membership: "{{ item.group_membership | default(omit) }}"
    group_name: "{{ item.group_name | default(omit) }}"
    host: "{{ item.host | default(omit) }}"
    idp_entityid: "{{ item.idp_entityid | default(omit) }}"
    idp_type: "{{ item.idp_type | default(omit) }}"
    nameid_format: "{{ item.nameid_format | default(omit) }}"
    port: "{{ item.port | default(omit) }}"
    provision_groups: "{{ item.provision_groups | default(omit) }}"
    provision_media: "{{ item.provision_media | default(omit) }}"
    provision_status: "{{ item.provision_status | default(omit) }}"
    scim_status: "{{ item.scim_status | default(omit) }}"
    search_attribute: "{{ item.search_attribute | default(omit) }}"
    search_filter: "{{ item.search_filter | default(omit) }}"
    sign_assertions: "{{ item.sign_assertions | default(omit) }}"
    sign_authn_requests: "{{ item.sign_authn_requests | default(omit) }}"
    sign_logout_requests: "{{ item.sign_logout_requests | default(omit) }}"
    sign_logout_responses: "{{ item.sign_logout_responses | default(omit) }}"
    sign_messages: "{{ item.sign_messages | default(omit) }}"
    slo_url: "{{ item.slo_url | default(omit) }}"
